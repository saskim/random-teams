<div class="app-shell">
  <!-- ── Desktop sidebar ───────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="material-icons brand-icon">sports_soccer</span>
      <span class="brand-name">RandomTeams</span>
    </div>

    <nav class="sidebar-nav">
      <a
        class="sidebar-link"
        routerLink="/players"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }">
        <span class="material-icons nav-icon">people</span>
        <span class="nav-label">Players</span>
      </a>

      <div class="step-connector">
        <span class="material-icons connector-arrow">arrow_downward</span>
      </div>

      <a
        class="sidebar-link"
        routerLink="/teams"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }">
        <span class="material-icons nav-icon">groups</span>
        <span class="nav-label">Teams</span>
      </a>

      <div class="step-connector">
        <span class="material-icons connector-arrow">arrow_downward</span>
      </div>

      <a
        class="sidebar-link"
        routerLink="/matches"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }">
        <span class="material-icons nav-icon">sports_soccer</span>
        <span class="nav-label">Matches</span>
      </a>

      <div class="step-connector">
        <span class="material-icons connector-arrow">arrow_downward</span>
      </div>

      <a
        class="sidebar-link"
        routerLink="/scoreboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }">
        <span class="material-icons nav-icon">emoji_events</span>
        <span class="nav-label">Scoreboard</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button
        class="theme-btn"
        (click)="toggleDarkMode()"
        [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
        <span class="material-icons">{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</span>
      </button>
      <span class="version-label">v{{ version }}</span>
    </div>
  </aside>

  <!-- ── Main content area ─────────────────────────────────────────────── -->
  <div class="main-area">
    <header class="page-header">
      <div class="header-brand">
        <span class="material-icons brand-icon">sports_soccer</span>
        <span class="brand-name">RandomTeams</span>
      </div>
      <h1 class="page-title">{{ title }}</h1>
      <div class="header-right">
        <span class="header-version">v{{ version }}</span>
        <button
          class="header-theme-btn"
          (click)="toggleDarkMode()"
          [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
          <span class="material-icons">{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</span>
        </button>
      </div>
    </header>

    <main class="page-content">
      <div class="content-inner">
        <router-outlet />
      </div>
    </main>
  </div>

  <!-- ── Mobile bottom navigation ──────────────────────────────────────── -->
  <nav class="bottom-nav">
    <a
      class="bottom-tab"
      routerLink="/players"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }">
      <span class="material-icons tab-icon">people</span>
      <span class="tab-label">Players</span>
    </a>
    <span class="tab-arrow" aria-hidden="true">›</span>
    <a
      class="bottom-tab"
      routerLink="/teams"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }">
      <span class="material-icons tab-icon">groups</span>
      <span class="tab-label">Teams</span>
    </a>
    <span class="tab-arrow" aria-hidden="true">›</span>
    <a
      class="bottom-tab"
      routerLink="/matches"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }">
      <span class="material-icons tab-icon">sports_soccer</span>
      <span class="tab-label">Matches</span>
    </a>
    <span class="tab-arrow" aria-hidden="true">›</span>
    <a
      class="bottom-tab"
      routerLink="/scoreboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }">
      <span class="material-icons tab-icon">emoji_events</span>
      <span class="tab-label">Score</span>
    </a>
  </nav>
</div>
