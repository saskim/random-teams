<div class="stars">
  @for (star of stars; track star) {
    <button
      type="button"
      class="star-btn"
      [class.filled]="star <= rating()"
      (click)="setRating(star)"
      [attr.aria-label]="'Rate ' + star + ' stars'">
      <span class="material-icons">{{ star <= rating() ? 'star' : 'star_border' }}</span>
    </button>
  }
</div>
